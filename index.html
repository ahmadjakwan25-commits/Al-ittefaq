<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>আল-ইত্তেফাক</title>
<meta name="description" content="ইত্তেফাকুত ত্বলাবা ওয়াল উলামা — অরাজনৈতিক ইসলামিক সেবামূলক সংগঠন, ৪নং চর, ইসলামপুর, জামালপুর।">
<meta name="theme-color" content="#0b4a3f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.jpg">
<link rel="apple-touch-icon" href="icon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0b4a3f;--g2:#06352d;--m:#6b0000;--cream:#fbf7e6;--bg:#f2f5f1;--card:#fff;--tx:#1b2a26;--mut:#5f6f6a;--ln:#dfe6e1;--in:#13805f;--ex:#b3261e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:78px;line-height:1.55}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
header img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.7);background:var(--g)}
header .t{flex:1;min-width:0}
header .t b{display:block;font-size:18px;line-height:1.2}
header .t small{opacity:.8;font-size:12px}
.bell{position:relative;background:rgba(255,255,255,.14);border:0;color:#fff;width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer}
.bell i{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;border-radius:10px;background:#f0b400;color:#222;font:700 11px/19px inherit;font-style:normal;text-align:center;padding:0 4px}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2,.card h3{margin:0 0 8px;color:var(--g)}
.hero{text-align:center;background:linear-gradient(160deg,var(--g),var(--g2));color:#fff;border:0}
.hero img{width:150px;height:150px;border-radius:50%;border:4px solid rgba(255,255,255,.85);object-fit:cover;background:var(--g)}
.hero h1{margin:10px 0 2px;font-size:23px;line-height:1.3}
.hero p{margin:2px 0;opacity:.92}
.pill{display:inline-block;background:rgba(255,255,255,.16);border-radius:20px;padding:3px 12px;font-size:13px;margin:6px 3px 0}
.muted{color:var(--mut)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-radius:14px;padding:10px 6px;text-align:center;background:var(--bg);border:1px solid var(--ln)}
.stat small{display:block;color:var(--mut);font-size:12px}
.stat b{font-size:16px}
.in{color:var(--in)}.ex{color:var(--ex)}
.row{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.row .grow{flex:1;min-width:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.amt{font-weight:700;white-space:nowrap}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:#fff;margin:4px 0 8px}
input[type=checkbox]{width:auto;margin:0 8px 0 0;transform:scale(1.25)}
textarea{min-height:80px;resize:vertical}
label{font-size:13px;color:var(--mut)}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 16px;background:var(--g);color:#fff;cursor:pointer}
.btn.alt{background:#e7efe9;color:var(--g)}
.btn.red{background:var(--ex)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;font:inherit;font-size:11px;color:var(--mut);padding:8px 2px 7px;cursor:pointer}
nav button span{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--g);font-weight:700}
.ci a{color:var(--g);font-weight:600;text-decoration:none}
.unread{border-left:4px solid #f0b400}
#admin{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;display:none}
#admin.show{display:block}
.abar{position:sticky;top:0;background:var(--m);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;z-index:2}
.abar b{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 0}
.tabs button{flex:none;font:inherit;border:1px solid var(--ln);background:#fff;border-radius:20px;padding:6px 14px;cursor:pointer}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.warn{background:#fff4d6;border:1px solid #f0d98a;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;z-index:99;font-size:14px;max-width:90%}
.empty{text-align:center;color:var(--mut);padding:22px 0}

/* ---- সদস্য কার্ড ---- */
.mgrid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:620px){.mgrid{grid-template-columns:1fr 1fr}}
.mc{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.10);border:1px solid var(--ln)}
.mc-top{background:linear-gradient(135deg,var(--a),var(--b));height:78px;padding:10px 12px;display:flex;justify-content:space-between;align-items:flex-start}
.mc-top .sl{background:rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:2px 12px;font-size:13px;font-weight:600}
.mc-top .bl{background:#fff;color:#b3261e;border-radius:20px;padding:2px 12px;font-size:14px;font-weight:700;direction:ltr}
.mc-ph{width:96px;height:96px;border-radius:50%;margin:-48px auto 0;border:4px solid #fff;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;display:grid;place-items:center;font-size:38px;font-weight:700;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.mc-ph img{width:100%;height:100%;object-fit:cover}
.mc h3{text-align:center;margin:8px 10px 2px;font-size:20px;color:var(--a)}
.mc .prof{text-align:center;color:var(--mut);font-size:14px;margin-bottom:6px}
.mc-b{padding:4px 16px 14px}
.mc-b div{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--ln);font-size:14.5px}
.mc-b div:last-child{border:0}
.mc-b span{flex:none;width:86px;color:var(--mut)}
.mc-b b{flex:1;font-weight:600;word-break:break-word}
.mc-b a{color:var(--a);text-decoration:none}
.pv{width:84px;height:84px;border-radius:50%;background:var(--bg);border:2px dashed var(--ln);display:grid;place-items:center;font-size:28px;overflow:hidden}
.pv img{width:100%;height:100%;object-fit:cover}
.chk{display:flex;align-items:center;margin:6px 0 10px;font-size:14px;color:var(--tx)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:10px;border:1px solid var(--ln)}
.seg button{flex:1;font:inherit;border:0;background:none;padding:7px 4px;border-radius:10px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--g);color:#fff;font-weight:600}
.nav2{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.nav2 button{font:inherit;border:1px solid var(--ln);background:#fff;border-radius:10px;width:42px;height:36px;cursor:pointer}
.nav2 b{color:var(--g);font-size:17px}
.sn{display:inline-block;min-width:28px;text-align:center;background:var(--g);color:#fff;border-radius:8px;font-size:12px;padding:1px 6px;margin-right:4px}
</style>
</head>
<body>
<header>
  <img id="logo" src="icon.jpg" alt="লোগো" onerror="this.style.visibility='hidden'">
  <div class="t"><b>আল-ইত্তেফাক</b><small>ইত্তেফাকুত ত্বলাবা ওয়াল উলামা</small></div>
  <button class="bell" id="bell" aria-label="নোটিফিকেশন">🔔<i id="badge" hidden>0</i></button>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-t="about"><span>🕌</span>পরিচিতি</button>
  <button data-t="members"><span>👥</span>সদস্য</button>
  <button data-t="chanda"><span>🗓️</span>চাঁদা</button>
  <button data-t="money"><span>💰</span>আয়-ব্যয়</button>
  <button data-t="notices"><span>📢</span>ঘোষণা</button>
  <button data-t="contact"><span>📞</span>যোগাযোগ</button>
</nav>
<div id="admin"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bn=n=>Number(n||0).toLocaleString('bn-BD');
const fdate=d=>{try{return new Date(d).toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'})}catch(e){return d||''}};
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}

/* ---------- মাস ও চাঁদার হিসাব ---------- */
const MN=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const bny=n=>Number(n).toLocaleString('bn-BD',{useGrouping:false});
const ymLabel=ym=>{const p=ym.split('-');return MN[+p[1]-1]+' '+bny(p[0])};
const ymIdx=ym=>{const p=ym.split('-').map(Number);return p[0]*12+p[1]-1};
const idxYm=i=>{const y=Math.floor(i/12),m=i%12+1;return y+'-'+String(m).padStart(2,'0')};
const nowYM=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const shiftYM=(ym,n)=>idxYm(ymIdx(ym)+n);
const CH=src=>Object.assign({amount:0,start:'2026-10',public:true},(src&&src.chanda)||{});
const isEx=m=>m.camt!=null&&m.camt!==''&&Number(m.camt)===0;
const mAmt=(m,src)=>(m.camt===''||m.camt==null)?(Number(CH(src).amount)||0):(Number(m.camt)||0);
const mStart=(m,src)=>m.cstart||CH(src).start;
const sortM=a=>[...a].sort((x,y)=>((+x.serial||1e9)-(+y.serial||1e9))||String(x.name||'').localeCompare(String(y.name||''),'bn'));
function calc(src,from,to){
  const now=ymIdx(nowYM()),byM={};
  (src.payments||[]).forEach(p=>{(byM[p.mid]=byM[p.mid]||{})[p.ym]=p});
  return sortM(src.members||[]).filter(m=>!isEx(m)).map(m=>{
    const pm=byM[m.id]||{},a=mAmt(m,src);
    const s=Math.max(ymIdx(mStart(m,src)),from),e=Math.min(now,to);
    let expected=0,dueN=0;
    for(let i=s;i<=e;i++){expected++;if(!pm[idxYm(i)])dueN++}
    let paidN=0,paidAmt=0;
    for(const k in pm){const i=ymIdx(k);if(i>=from&&i<=to){paidN++;paidAmt+=Number(pm[k].amount)||0}}
    return{m,a,expected,dueN,dueAmt:dueN*a,paidN,paidAmt,paidThis:from===to?!!pm[idxYm(from)]:null,inRange:s<=e};
  });
}
const sumRows=r=>({paid:r.reduce((a,x)=>a+x.paidAmt,0),due:r.reduce((a,x)=>a+x.dueAmt,0),dueN:r.reduce((a,x)=>a+x.dueN,0),paidN:r.reduce((a,x)=>a+x.paidN,0)});

/* ---------- এনক্রিপশন (গোপন তথ্যের জন্য) ---------- */
const TE=new TextEncoder(),TD=new TextDecoder();
const b64e=u8=>{let s='';u8.forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,saltB64){
  const km=await crypto.subtle.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(saltB64),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encStr(key,text){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,TE.encode(text)));
  const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return b64e(o);
}
async function decStr(key,b){const u=b64d(b);return TD.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12)))}

const DEFAULT={org:{name:'ইত্তেফাকুত ত্বলাবা ওয়াল উলামা',address:'৪নং চর নতুন পাড়া, ইসলামপুর, জামালপুর',established:'২০১৮',about:'ইত্তেফাকুত ত্বলাবা ওয়াল উলামা একটি অরাজনৈতিক ইসলামিক সেবামূলক সংগঠন।',mission:'',contacts:{phone:'',whatsapp:'',email:'',facebook:''}},members:[],transactions:[],notices:[],chanda:{amount:0,start:'2026-10',public:true},payments:[],adminHash:''};
let DB=clone(DEFAULT),draft=null,tab='about',isAdmin=false,adminTab='members',editing=null,dirty=false;
let adminKey=null,formPhoto=null,removePhoto=false;

async function load(){
  try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;DB=Object.assign(clone(DEFAULT),await r.json());lsSet('ai_cache',DB)}
  catch(e){DB=Object.assign(clone(DEFAULT),lsGet('ai_cache',{}))}
  render();updateBadge();maybeNotify();
}

/* ---------- Notifications ---------- */
const seen=()=>new Set(lsGet('ai_seen',[]));
function unreadList(){const s=seen();return (DB.notices||[]).filter(n=>!s.has(n.id))}
function updateBadge(){const n=unreadList().length;const b=$('#badge');b.hidden=!n;b.textContent=bn(n)}
function markSeen(){lsSet('ai_seen',(DB.notices||[]).map(n=>n.id));updateBadge()}
function maybeNotify(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const lastN=lsGet('ai_pushed',[]);const fresh=unreadList().filter(n=>!lastN.includes(n.id));
  fresh.slice(0,3).forEach(n=>{try{new Notification('আল-ইত্তেফাক: '+n.title,{body:n.body,icon:'icon.jpg'})}catch(e){}});
  lsSet('ai_pushed',(DB.notices||[]).map(n=>n.id));
}
async function askPerm(){
  if(!('Notification' in window)){toast('এই ব্রাউজারে নোটিফিকেশন সমর্থিত নয়');return}
  const p=await Notification.requestPermission();toast(p==='granted'?'নোটিফিকেশন চালু হয়েছে':'অনুমতি দেওয়া হয়নি');render();
}

/* ---------- Public views ---------- */
function vAbout(){const o=DB.org;return `
<div class="card hero"><img src="icon.jpg" alt="" onerror="this.style.display='none'">
<h1>${esc(o.name)}</h1><p>অরাজনৈতিক ইসলামিক সেবামূলক সংগঠন</p>
<span class="pill">স্থাপিত: ${esc(o.established)} খ্রিঃ</span><span class="pill">📍 ${esc(o.address)}</span></div>
<div class="card"><h2>আমাদের পরিচিতি</h2><p>${esc(o.about)}</p></div>
${o.mission?`<div class="card"><h2>আমাদের লক্ষ্য</h2><p>${esc(o.mission)}</p></div>`:''}
<div class="card"><h3>এক নজরে</h3><div class="grid3">
<div class="stat"><small>সদস্য</small><b>${bn((DB.members||[]).length)}</b></div>
<div class="stat"><small>ঘোষণা</small><b>${bn((DB.notices||[]).length)}</b></div>
<div class="stat"><small>স্থাপিত</small><b>${esc(o.established)}</b></div></div></div>`}

const PALS=[['#0b4a3f','#13a07a'],['#6b0000','#d1453b'],['#1a3c6e','#3b82f6'],['#5b2a86','#a35bd6'],['#8a5a00','#e8a21a'],['#00606e','#18b4c9']];
const sortMembers=a=>[...a].sort((x,y)=>((+x.serial||1e9)-(+y.serial||1e9))||String(x.name||'').localeCompare(String(y.name||''),'bn'));
const photoSrc=m=>m.photoData?m.photoData:(m.photo?m.photo+'?v='+(m.pv||''):'');
function memberCard(m,i){
  const p=PALS[((+m.serial||i+1)-1)%PALS.length];
  const src=photoSrc(m);
  const rows=[['পিতার নাম',m.father],['পেশা',m.profession],['গ্রাম',m.village],['পোস্ট',m.post],['থানা',m.thana],['জেলা',m.district]]
    .filter(r=>r[1]).map(r=>`<div><span>${r[0]}</span><b>${esc(r[1])}</b></div>`).join('');
  const mob=m.showPhone&&m.mobile?`<div><span>মোবাইল</span><b><a href="tel:${esc(m.mobile)}">${esc(m.mobile)}</a></b></div>`:'';
  return `<div class="mc" style="--a:${p[0]};--b:${p[1]}">
<div class="mc-top"><span class="sl">ক্রমিক নং ${bn(m.serial||i+1)}</span>${m.blood?`<span class="bl">🩸 ${esc(m.blood)}</span>`:''}</div>
<div class="mc-ph">${src?`<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">`:esc((m.name||'?').trim().charAt(0))}</div>
<h3>${esc(m.name)}</h3>
<div class="mc-b">${rows}${mob}</div></div>`;
}
function vMembers(){
  const q=(window._mq||'').trim().toLowerCase();
  const all=sortMembers(DB.members||[]);
  const list=all.filter(m=>!q||[m.name,m.father,m.profession,m.village,m.post,m.thana,m.district,m.blood,m.serial].join(' ').toLowerCase().includes(q));
  return `<div class="card"><h2>সদস্য তালিকা (${bn(all.length)} জন)</h2>
<input id="mq" placeholder="🔍 নাম, গ্রাম, রক্তের গ্রুপ বা ক্রমিক নং দিয়ে খুঁজুন" value="${esc(window._mq||'')}" style="margin-bottom:0"></div>
${list.length?`<div class="mgrid">${list.map(memberCard).join('')}</div>`:'<div class="card"><div class="empty">কোনো সদস্য পাওয়া যায়নি</div></div>'}`}

function vChanda(){
  const sc=window._cs||'month',cm=window._cm||nowYM(),cy=window._cy||nowYM().slice(0,4);
  const from=sc==='month'?ymIdx(cm):sc==='year'?ymIdx(cy+'-01'):0;
  const to=sc==='month'?ymIdx(cm):sc==='year'?ymIdx(cy+'-12'):1e9;
  const rows=calc(DB,from,to),t=sumRows(rows);
  const seg=`<div class="seg"><button data-cs="month" class="${sc==='month'?'on':''}">মাসিক</button><button data-cs="year" class="${sc==='year'?'on':''}">বাৎসরিক</button><button data-cs="all" class="${sc==='all'?'on':''}">আজীবন</button></div>`;

    return `<div class="row"><div class="grow"><span class="sn">${bn(r.m.serial)}</span><b>${esc(r.m.name)}</b>${sub}</div>${right}</div>`;
  }).join('');
  return `<div class="card"><h2>মাসিক চাঁদা</h2>${seg}${sel}
${+CH(DB).amount===0?'<div class="warn">মাসিক চাঁদার পরিমাণ এখনো ঠিক করা হয়নি।</div>':''}

}

const newSalt=()=>b64e(crypto.getRandomValues(new Uint8Array(16)));
async function prepDraft(salt){
  draft=clone(DB);draft.encSalt=salt;
  for(let i=0;i<draft.members.length;i++){
    const m=draft.members[i];
    if(m.enc){try{Object.assign(m,JSON.parse(await decStr(adminKey,m.enc)))}catch(e){}}
    delete m.enc;
    if(m.phone&&!m.mobile)m.mobile=m.phone;delete m.phone;
    if(!m.serial)m.serial=i+1;
  }
}
async function openAdmin(){
  const A=$('#admin');A.classList.add('show');document.body.style.overflow='hidden';
  if(isAdmin){return renderAdmin()}
  const first=!DB.check&&!DB.adminHash;
  A.innerHTML=`<div class="abar"><b>🔐 ${first?'অ্যাডমিন সেটআপ':'অ্যাডমিন লগইন'}</b><button class="btn alt sm" id="aclose">বন্ধ</button></div><main><div class="card">${first?`<h2>নতুন পাসওয়ার্ড দিন</h2><p class="muted">কমপক্ষে ৮ অক্ষর, যত বড় তত ভালো। এই পাসওয়ার্ড দিয়েই সদস্যদের গোপন তথ্য (মোবাইল, এনআইডি) এনক্রিপ্ট হবে। ভুলে গেলে সেই তথ্য আর ফেরত পাওয়া যাবে না।</p><input type="password" id="p1" placeholder="পাসওয়ার্ড"><input type="password" id="p2" placeholder="আবার লিখুন"><button class="btn" id="aset">সেট করুন</button>`:`<input type="password" id="p1" placeholder="পাসওয়ার্ড"><button class="btn" id="alog">প্রবেশ</button>`}</div></main>`;
  $('#aclose').onclick=closeAdmin;
  if(first){
    $('#aset').onclick=async()=>{
      const a=$('#p1').value,b=$('#p2').value;
      if(a.length<8)return toast('কমপক্ষে ৮ অক্ষর দিন');if(a!==b)return toast('দুটি পাসওয়ার্ড মেলেনি');
      toast('অপেক্ষা করুন…');const salt=newSalt();adminKey=await deriveKey(a,salt);
      await prepDraft(salt);dirty=true;isAdmin=true;renderAdmin();
    };
  }else{
    const login=async()=>{
      const pw=$('#p1').value;if(!pw)return;toast('অপেক্ষা করুন…');
      let ok=false,salt;
      try{
        if(DB.check&&DB.encSalt){salt=DB.encSalt;adminKey=await deriveKey(pw,salt);ok=(await decStr(adminKey,DB.check))==='ok'}
        else if(DB.adminHash){ok=(await sha(pw))===DB.adminHash;if(ok){salt=newSalt();adminKey=await deriveKey(pw,salt)}}
      }catch(e){ok=false}
      if(!ok){adminKey=null;return toast('পাসওয়ার্ড ভুল')}
      await prepDraft(salt);dirty=!DB.check;isAdmin=true;renderAdmin();
    };
    $('#alog').onclick=login;$('#p1').onkeydown=e=>{if(e.key==='Enter')login()};
  }
}

/* ---------- ছবি ছোট করা ---------- */
function resizeImg(file,size=360){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
    const s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=(im.height-s)*0.2;
    x.fillStyle='#fff';x.fillRect(0,0,size,size);x.drawImage(im,sx,sy,s,s,0,0,size,size);
    URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.8))};
  im.onerror=()=>{URL.revokeObjectURL(url);rej()};im.src=url})}

function bindAdmin(){
  const k=adminTab,body=$('#abody');
  const ca=$('#acancel');if(ca)ca.onclick=()=>{editing=null;formPhoto=null;removePhoto=false;renderAdmin()};
  body.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing={k,item:draft[k].find(x=>x.id===b.dataset.edit)};formPhoto=null;removePhoto=false;renderAdmin();window.scrollTo(0,0);$('#admin').scrollTo(0,0)});
  body.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm('মুছে ফেলবেন?'))return;draft[k]=draft[k].filter(x=>x.id!==b.dataset.del);if(k==='members')draft.payments=(draft.payments||[]).filter(p=>p.mid!==b.dataset.del);dirty=true;renderAdmin()});

  if(k==='members'){
    const pf=$('#pfile');
    if(pf)pf.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{formPhoto=await resizeImg(f);removePhoto=false;$('#pvbox').innerHTML=`<img src="${formPhoto}" alt="">`}catch(x){toast('ছবি পড়া যায়নি')}};
    const pr=$('#prm');if(pr)pr.onclick=()=>{formPhoto=null;removePhoto=true;$('#pvbox').textContent='📷';const f=$('#pfile');if(f)f.value=''};
    const sv=$('#asave');
    if(sv)sv.onclick=()=>{
      const obj={};body.querySelectorAll('[data-f]').forEach(i=>obj[i.dataset.f]=i.type==='checkbox'?i.checked:i.value.trim());
      if(!obj.name)return toast('নাম লিখুন');
      let sr=Math.floor(Number(obj.serial));if(!(sr>0))sr=Math.max(0,...draft.members.map(m=>+m.serial||0))+1;obj.serial=sr;
      if(editing&&editing.k==='members'){
        const i=draft.members.findIndex(x=>x.id===editing.item.id);const item=Object.assign({},editing.item,obj);
        if(formPhoto)item.photoData=formPhoto;
        if(removePhoto){delete item.photo;delete item.photoData;delete item.pv}
        draft.members[i]=item;
      }else{obj.id=uid();if(formPhoto)obj.photoData=formPhoto;draft.members.push(obj)}
      editing=null;formPhoto=null;removePhoto=false;dirty=true;renderAdmin();toast('খসড়ায় যোগ হয়েছে');
    };
  }else if(k==='transactions'||k==='notices'){
    const sv=$('#asave');
    if(sv)sv.onclick=()=>{
      const obj={};body.querySelectorAll('[data-f]').forEach(i=>obj[i.dataset.f]=i.value.trim());
      if(!obj.title)return toast('প্রয়োজনীয় ঘর পূরণ করুন');
      if(k==='transactions'){obj.amount=Number(obj.amount);if(!(obj.amount>0))return toast('সঠিক টাকার পরিমাণ দিন')}
      if(k==='notices'&&!(editing&&editing.k===k))obj.date=today();
      if(editing&&editing.k===k){const i=draft[k].findIndex(x=>x.id===editing.item.id);draft[k][i]=Object.assign({},editing.item,obj)}
      else{obj.id=uid();draft[k].push(obj)}
      editing=null;dirty=true;renderAdmin();toast('খসড়ায় যোগ হয়েছে');
    };
  }
  if(k==='chanda')bindChanda();
  const ai=$('#ainfo');if(ai)ai.onclick=()=>{
    body.querySelectorAll('[data-o]').forEach(i=>draft.org[i.dataset.o]=i.value.trim());
    draft.org.contacts=draft.org.contacts||{};body.querySelectorAll('[data-c]').forEach(i=>draft.org.contacts[i.dataset.c]=i.value.trim());
    dirty=true;renderAdmin();toast('খসড়ায় সংরক্ষিত');
  };
  const pb=$('#apub');if(pb)pb.onclick=publish;
  const ex=$('#aexp');if(ex)ex.onclick=()=>{const d=clone(draft);d.members.forEach(m=>delete m.photoData);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='al-ittefaq-backup-'+today()+'.json';a.click()};
  const cp=$('#achp');if(cp)cp.onclick=async()=>{
    const p=$('#np').value;if(p.length<8)return toast('কমপক্ষে ৮ অক্ষর দিন');
    toast('অপেক্ষা করুন…');const salt=newSalt();adminKey=await deriveKey(p,salt);draft.encSalt=salt;dirty=true;renderAdmin();toast('নতুন পাসওয়ার্ড খসড়ায় — প্রকাশ করুন');
  };
}

/* ---------- প্রকাশ (GitHub API) ---------- */
const b64=s=>{const b=TE.encode(s);let r='';b.forEach(x=>r+=String.fromCharCode(x));return btoa(r)};
const ghErr=st=>new Error(st===401||st===403?'টোকেন সঠিক নয় বা Contents লেখার অনুমতি নেই':st===409?'সংঘর্ষ হয়েছে, আবার চেষ্টা করুন':'সেভ ব্যর্থ ('+st+')');
async function putFile(base,H,path,content64,msg){
  let sha1;const g=await fetch(base+path,{headers:H,cache:'no-store'});
  if(g.ok)sha1=(await g.json()).sha;else if(g.status!==404)throw ghErr(g.status);
  const body={message:msg,content:content64};if(sha1)body.sha=sha1;
  const p=await fetch(base+path,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify(body)});
  if(!p.ok)throw ghErr(p.status);
}
async function buildPublic(){
  const out=clone(draft);out.members=[];
  for(const m of draft.members){
    const pub={id:m.id,serial:m.serial,name:m.name,father:m.father||'',profession:m.profession||'',blood:m.blood||'',village:m.village||'',post:m.post||'',thana:m.thana||'',district:m.district||'',showPhone:!!m.showPhone,camt:m.camt==null?'':m.camt,cstart:m.cstart||''};
    if(m.photo){pub.photo=m.photo;pub.pv=m.pv}
    if(m.showPhone&&m.mobile)pub.mobile=m.mobile;
    const sec={mobile:m.mobile||'',guardian:m.guardian||'',nid:m.nid||''};
    if(sec.mobile||sec.guardian||sec.nid)pub.enc=await encStr(adminKey,JSON.stringify(sec));
    out.members.push(pub);
  }
  out.check=await encStr(adminKey,'ok');delete out.adminHash;
  return out;
}
async function publish(){
  const o=$('#gho').value.trim(),r=$('#ghr').value.trim(),t=$('#ght').value.trim();
  if(!o||!r||!t)return toast('ইউজারনেম, রিপো ও টোকেন দিন');
  lsSet('ai_gh',{owner:o,repo:r,token:t});
  const base=`https://api.github.com/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}/contents/`;
  const H={Authorization:'Bearer '+t,Accept:'application/vnd.github+json'};
  const btn=$('#apub');btn.disabled=true;btn.textContent='প্রকাশ হচ্ছে…';
  try{
    for(const m of draft.members){
      if(m.photoData){
        btn.textContent='ছবি আপলোড হচ্ছে…';
        const path='photos/'+m.id+'.jpg';
        await putFile(base,H,path,m.photoData.split(',')[1],'সদস্যের ছবি');
        m.photo=path;m.pv=Date.now();delete m.photoData;
      }
    }
    btn.textContent='তথ্য সেভ হচ্ছে…';
    const out=await buildPublic();
    await putFile(base,H,'data.json',b64(JSON.stringify(out,null,2)),'ডাটা আপডেট');
    DB=clone(out);lsSet('ai_cache',DB);dirty=false;render();updateBadge();toast('✅ সফলভাবে প্রকাশিত হয়েছে');renderAdmin();
  }catch(e){toast('❌ '+e.message);const b=$('#apub');if(b){b.disabled=false;b.textContent='🚀 প্রকাশ করুন'}}
}
