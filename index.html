.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.in{color:var(--in)}.ex{color:var(--ex)}

textarea{min-height:80px;resize:vertical}
label{font-size:13px;color:var(--mut)}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 16px;background:var(--g);color:#fff;cursor:pointer}

.unread{border-left:4px solid #f0b400}

const bn=n=>Number(n||0).toLocaleString('bn-BD');

async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}

/* ---------- মাস ও চাঁদার হিসাব ---------- */
const MN=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const bny=n=>Number(n).toLocaleString('bn-BD',{useGrouping:false});
const ymLabel=ym=>{const p=ym.split('-');return MN[+p[1]-1]+' '+bny(p[0])};
const ymIdx=ym=>{const p=ym.split('-').map(Number);return p[0]*12+p[1]-1};
const idxYm=i=>{const y=Math.floor(i/12),m=i%12+1;return y+'-'+String(m).padStart(2,'0')};
const nowYM=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const shiftYM=(ym,n)=>idxYm(ymIdx(ym)+n);
const CH=src=>Object.assign({amount:0,start:'2026-10',public:true},(src&&src.chanda)||{});
const isEx=m=>m.camt!=null&&m.camt!==''&&Number(m.camt)===0;
const mAmt=(m,src)=>(m.camt===''||m.camt==null)?(Number(CH(src).amount)||0):(Number(m.camt)||0);
const mStart=(m,src)=>m.cstart||CH(src).start;
const sortM=a=>[...a].sort((x,y)=>((+x.serial||1e9)-(+y.serial||1e9))||String(x.name||'').localeCompare(String(y.name||''),'bn'));
function calc(src,from,to){
  const now=ymIdx(nowYM()),byM={};
  (src.payments||[]).forEach(p=>{(byM[p.mid]=byM[p.mid]||{})[p.ym]=p});
  return sortM(src.members||[]).filter(m=>!isEx(m)).map(m=>{
    const pm=byM[m.id]||{},a=mAmt(m,src);
    const s=Math.max(ymIdx(mStart(m,src)),from),e=Math.min(now,to);
    let expected=0,dueN=0;
    for(let i=s;i<=e;i++){expected++;if(!pm[idxYm(i)])dueN++}
    let paidN=0,paidAmt=0;
    for(const k in pm){const i=ymIdx(k);if(i>=from&&i<=to){paidN++;paidAmt+=Number(pm[k].amount)||0}}
    return{m,a,expected,dueN,dueAmt:dueN*a,paidN,paidAmt,paidThis:from===to?!!pm[idxYm(from)]:null,inRange:s<=e};
  });
}
const sumRows=r=>({paid:r.reduce((a,x)=>a+x.paidAmt,0),due:r.reduce((a,x)=>a+x.dueAmt,0),dueN:r.reduce((a,x)=>a+x.dueN,0),paidN:r.reduce((a,x)=>a+x.paidN,0)});

/* ---------- এনক্রিপশন (গোপন তথ্যের জন্য) ---------- */
const TE=new TextEncoder(),TD=new TextDecoder();
const b64e=u8=>{let s='';u8.forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,saltB64){
  const km=await crypto.subtle.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(saltB64),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encStr(key,text){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,TE.encode(text)));
  const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return b64e(o);
}
async function decStr(key,b){const u=b64d(b);return TD.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12)))}

async function prepVideo(file){

    try{const r=await recompress(v,dur);URL.revokeObjectURL(url);return r}catch(e){}

function recompress(v,dur){return new Promise((resolve,reject)=>{

  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{try{ac&&ac.close()}catch(e){}const b=new Blob(chunks,{type:mt.split(';')[0]});b.size>1000?resolve({blob:b,m:mt.split(';')[0],d:dur}):reject(new Error('x'))};

  guard=setTimeout(finish,(dur+6)*1000);
  rec.start(500);

})}

async function pollChat(kind,force){

    if(!j.ok)return;
    chat[kind]=j.msgs||[];lsSet('ai_c_'+kind,chat[kind].slice(-60));
    const have=new Set(chat[kind].map(m=>m.cid));pend[kind]=pend[kind].filter(m=>!have.has(m.cid));

function chatBind(kind){

    if(e.target.closest('video,audio'))return;
    const b=e.target.closest('.bub');if(!b)return;const m=curList[kind][+b.dataset.i];if(!m)return;

    if(m.pending)return;

    replyTo[kind]={n:m.from==='admin'?'অ্যাডমিন':(mine?(myName()||'আমি'):(m.name||'সদস্য')),t:(m.text||(m.med?(parseRe(m.med)||{}).k==='v'?'🎬 ভিডিও':'🎤 ভয়েস':'📷 ছবি')).slice(0,100)};

function queueMsg(kind,o){
  const text=o.text||'',img=o.img||'',medb=o.medb||'';if(!text&&!img&&!medb)return;
  const m={cid:devId.slice(0,6)+Date.now().toString(36)+Math.random().toString(36).slice(2,5),text,img,medb,med:o.med||null,localUrl:o.localUrl||'',re:replyTo[kind]||'',ts:Date.now(),st:navigator.onLine?'q':'x'};
  replyTo[kind]=null;pend[kind].push(m);rbarPaint(kind);chatPaint(kind,true);
  if(m.st==='x')toast('ইন্টারনেট সংযোগ নেই');else flush();

async function flush(){
  if(flushing)return;flushing=true;const u=TRK().url;
  try{for(const kind of ['dm','group']){
    for(const m of pend[kind]){
      if(m.st!=='q')continue;
      for(let t=0;t<5&&m.st==='q';t++){
        try{
          if(!chatReg){await fetch(u,{method:'POST',body:JSON.stringify({a:'beat',dev:devId,id:lsGet('ai_me',null)||'',name:myName(),pwa:false,ua:navigator.userAgent})});chatReg=true}
          const r=await fetch(u,{method:'POST',body:JSON.stringify({a:'msg',kind,dev:devId,name:myName(),text:m.text,cid:m.cid,img:m.img?m.img.split(',')[1]:'',med:m.med||'',medb:m.medb||'',re:m.re||''})});
          const j=await r.json();
          if(j.ok){m.st='ok';m.medb=''}
          else if(j.err==='slow'||j.err==='ratelimit')await sleep(1700);
          else{m.st='x';m.err=j.err;toast(j.err==='noname'?'আগে প্রোফাইলে তালিকা থেকে নিজের নাম বাছুন':'❌ পাঠানো যায়নি: '+String(j.err||'').slice(0,140))}
        }catch(e){await sleep(1500)}
      }
      if(m.st==='q'){m.st='x';toast('❌ পাঠানো যায়নি — ইন্টারনেট/সার্ভার দেখুন, তারপর বার্তায় ট্যাপ করুন')}
      chatPaint(kind,true);
    }
  }}finally{flushing=false}
  ['dm','group'].forEach(k=>{if(pend[k].some(m=>m.st==='ok'))pollChat(k,true)});
}

function initSlider(){
  clearInterval(slT);const el=$('#slider');if(!el)return;
  const sl=[...el.querySelectorAll('.sl')],dt=[...el.querySelectorAll('.dt')];if(sl.length<2)return;
  let i=0;const show=n=>{i=(n+sl.length)%sl.length;sl.forEach((x,k)=>x.classList.toggle('on',k===i));dt.forEach((x,k)=>x.classList.toggle('on',k===i))};
  const start=()=>{clearInterval(slT);slT=setInterval(()=>{if(document.visibilityState==='visible'&&$('#slider')===el)show(i+1);else if($('#slider')!==el)clearInterval(slT)},3500)};
  start();dt.forEach((x,k)=>x.onclick=()=>{show(k);start()});
  let x0=null;el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
  el.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>40){show(i+(dx<0?1:-1));start()}},{passive:true});
}

/* ---------- PDF ডাউনলোড (নিজস্ব PDF, বাইরের কোনো লাইব্রেরি লাগে না) ---------- */
const PW=794,PH=1123,PS=3;
const PFONT='"Tiro Bangla","Noto Serif Bengali","Noto Sans Bengali","Vrinda","Shonar Bangla",serif';
const PC={g:'#0b4a3f',gold:'#c9a227',ln:'#dfe6e1',mut:'#5f6f6a',tx:'#1b2a26',ok:'#eef8f2',due:'#fdeeed',tot:'#f6efd2',in:'#13805f',ex:'#b3261e',box:'#fbfcfb'};
const loadImg=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
class Pg{
  constructor(){this.cv=document.createElement('canvas');this.cv.width=PW*PS;this.cv.height=PH*PS;this.x=this.cv.getContext('2d');this.x.scale(PS,PS);this.x.fillStyle='#fff';this.x.fillRect(0,0,PW,PH);this.x.textBaseline='middle'}
  font(sz,w){this.x.font=(w||400)+' '+sz+'px '+PFONT}
  fit(t,maxW){const x=this.x;t=String(t==null?'':t);if(x.measureText(t).width<=maxW)return t;while(t.length>1&&x.measureText(t+'…').width>maxW)t=t.slice(0,-1);return t+'…'}
  text(t,px,py,o){o=o||{};const x=this.x;this.font(o.size||14,o.weight);x.fillStyle=o.color||PC.tx;x.textAlign=o.align||'left';t=o.maxW?this.fit(t,o.maxW):String(t==null?'':t);x.fillText(t,px,py)}
  tw(t,sz,w){this.font(sz,w);return this.x.measureText(String(t)).width}
  rect(px,py,w,h,fill,stroke,r){const x=this.x;x.beginPath();if(r&&x.roundRect)x.roundRect(px,py,w,h,r);else x.rect(px,py,w,h);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=1;x.stroke()}}
  line(x1,y1,x2,y2,col,w){const x=this.x;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.strokeStyle=col;x.lineWidth=w||1;x.stroke()}
  jpeg(){const b=atob(this.cv.toDataURL('image/jpeg',0.95).split(',')[1]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const r={u,w:this.cv.width,h:this.cv.height};this.cv.width=this.cv.height=0;return r}
}
function pgHeader(p,org,first,logo){
  p.rect(0,0,PW,10,PC.g);
  const sz=first?64:40,y0=first?26:22,tx=40+sz+14,mw=PW-40-tx;
  if(logo){const x=p.x;x.save();x.beginPath();x.arc(40+sz/2,y0+sz/2,sz/2,0,Math.PI*2);x.clip();x.drawImage(logo,40,y0,sz,sz);x.restore();x.beginPath();x.arc(40+sz/2,y0+sz/2,sz/2,0,Math.PI*2);x.strokeStyle=PC.gold;x.lineWidth=2;x.stroke()}
  p.text(org.name,tx,y0+sz/2-(first?11:8),{size:first?23:16,weight:700,color:PC.g,maxW:mw});
  p.text(org.address,tx,y0+sz/2+(first?14:11),{size:first?13.5:11.5,color:PC.mut,maxW:mw});
  const ly=y0+sz+10;p.line(40,ly,PW-40,ly,PC.gold,2);p.line(40,ly+4,PW-40,ly+4,PC.gold,1);
  return ly+16;
}
function pgFooter(p,no,total){
  p.line(40,PH-44,PW-40,PH-44,PC.ln,1);
  p.text('কম্পিউটার দ্বারা প্রস্তুতকৃত · তারিখ: '+fdate(today()),40,PH-30,{size:12,color:PC.mut});
  p.text('পৃষ্ঠা '+bn(no)+' / '+bn(total),PW-40,PH-30,{size:12,color:PC.mut,align:'right'});
}
function pgTitle(p,y,t,sub){
  p.rect(40,y,PW-80,34,PC.g,null,8);p.text(t,PW/2,y+17,{size:19,weight:700,color:'#fff',align:'center'});
  if(sub)p.text(sub,PW/2,y+48,{size:12.5,color:PC.mut,align:'center'});
  return y+(sub?66:44);
}
function pgSummary(p,y,items){
  const gap=8,w=(PW-80-gap*(items.length-1))/items.length;
  items.forEach((it,i)=>{const x=40+i*(w+gap);p.rect(x,y,w,52,PC.box,PC.ln,8);p.text(it[0],x+w/2,y+15,{size:12,color:PC.mut,align:'center'});p.text(it[1],x+w/2,y+36,{size:15.5,weight:700,color:it[2]||PC.tx,align:'center',maxW:w-8})});
  return y+62;
}
function pgInfo(p,y,items){
  const rows=Math.ceil(items.length/2),h=rows*24+14,cw=(PW-80)/2;
  p.rect(40,y,PW-80,h,PC.box,PC.ln,8);
  items.forEach((it,i)=>{const tx=54+(i%2)*cw,ty=y+7+Math.floor(i/2)*24+12,lw=p.tw(it[0]+':',13.5)+6;
    p.text(it[0]+':',tx,ty,{size:13.5,color:PC.mut});p.text(it[1],tx+lw,ty,{size:14,weight:600,maxW:cw-28-lw})});
  return y+h+10;
}
// cols: [{l:'শিরোনাম',w:সংখ্যা|null,al:'l'|'c'}]  rows: [{c:[...],k:'ok'|'due'|'tot',span:n}]
function pgTable(p,y,cols,rows){
  const fixed=cols.reduce((a,c)=>a+(c.w||0),0),tw=PW-80;
  const ws=cols.map(c=>c.w||(tw-fixed)),xs=[];let ax=40;ws.forEach(w=>{xs.push(ax);ax+=w});
  p.rect(40,y,tw,32,PC.g);
  cols.forEach((c,i)=>p.text(c.l,xs[i]+ws[i]/2,y+16,{size:12.5,weight:700,color:'#fff',align:'center',maxW:ws[i]-6}));
  y+=32;
  rows.forEach(r=>{
    p.rect(40,y,tw,28,PC[r.k||'ok']);
    let ci=0;
    r.c.forEach((v,j)=>{
      const sp=(j===0&&r.span)?r.span:1,x0=xs[ci],w=ws.slice(ci,ci+sp).reduce((a,b)=>a+b,0),al=cols[ci].al==='l'&&sp===1?'l':'c';
      p.text(v,al==='l'?x0+6:x0+w/2,y+14,{size:13,weight:r.k==='tot'?700:400,align:al==='l'?'left':'center',maxW:w-10});
      if(ci>0)p.line(x0,y,x0,y+28,PC.ln,1);
      ci+=sp;
    });
    p.line(40,y+28,40+tw,y+28,r.k==='tot'?PC.gold:PC.ln,1);
    y+=28;
  });
  p.rect(40,y-28*rows.length-32,tw,28*rows.length+32,null,PC.ln);
  return y;
}
function chunkRows(rows,first,rest){const out=[];let i=0,cap=first;while(i<rows.length){out.push(rows.slice(i,i+cap));i+=cap;cap=rest}if(!out.length)out.push([]);return out}

function buildPdfBlob(jp){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const put=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length};
  const n=jp.length,W=595.28,H=841.89,kids=jp.map((_,i)=>(3+3*i)+' 0 R').join(' ');
  put('%PDF-1.4\n');
  offs[1]=len;put('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offs[2]=len;put('2 0 obj\n<< /Type /Pages /Kids [ '+kids+' ] /Count '+n+' >>\nendobj\n');
  jp.forEach((j,i)=>{
    const pg=3+3*i,ct=4+3*i,im=5+3*i,cs='q '+W+' 0 0 '+H+' 0 0 cm /Im0 Do Q';
    offs[pg]=len;put(pg+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+ct+' 0 R >>\nendobj\n');
    offs[ct]=len;put(ct+' 0 obj\n<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
    offs[im]=len;put(im+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+j.w+' /Height '+j.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.u.length+' >>\nstream\n');put(j.u);put('\nendstream\nendobj\n');
  });
  const total=3+3*n,xr=len;
  put('xref\n0 '+total+'\n0000000000 65535 f \n');
  for(let i=1;i<total;i++)put(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  put('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
function downloadBlob(blob,name){
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},5000);
}
async function pdfPrep(){
  try{for(const w of [400,700])await document.fonts.load(w+' 16px "Tiro Bangla"','আবক১২৩0123');await document.fonts.ready}catch(e){}
  return await loadImg('icon.jpg');
}
async function withBusy(btn,fn){
  if(window._pdfBusy)return;window._pdfBusy=1;
  const old=btn&&btn.textContent;if(btn){btn.disabled=true;btn.textContent='⏳ PDF তৈরি হচ্ছে…'}

}
function pdfMember(src,id,btn){return withBusy(btn,async()=>{

const moneyFmt=n=>(n<0?'−':'')+'৳'+bn(Math.abs(n));
function moneyCard(pre){

function pdfMoney(src,from,to,btn){return withBusy(btn,async()=>{

const newSalt=()=>b64e(crypto.getRandomValues(new Uint8Array(16)));
async function prepDraft(salt){
  draft=clone(DB);draft.encSalt=salt;
  for(const key of ['members','advisors']){
    draft[key]=draft[key]||[];
    for(let i=0;i<draft[key].length;i++){
      const m=draft[key][i];
      if(m.enc){try{Object.assign(m,JSON.parse(await decStr(adminKey,m.enc)))}catch(e){}}
      delete m.enc;
      if(m.phone&&!m.mobile)m.mobile=m.phone;delete m.phone;
      if(!m.serial)m.serial=i+1;
    }
  }
}
async function openAdmin(){
  const A=$('#admin');A.classList.add('show');document.body.style.overflow='hidden';
  if(isAdmin){return renderAdmin()}
  const first=!DB.check&&!DB.adminHash;
  A.innerHTML=`<div class="abar"><b>🔐 ${first?'অ্যাডমিন সেটআপ':'অ্যাডমিন লগইন'}</b><button class="btn alt sm" id="aclose">বন্ধ</button></div><main><div class="card">${first?`<h2>নতুন পাসওয়ার্ড দিন</h2><p class="muted">কমপক্ষে ৮ অক্ষর, যত বড় তত ভালো। এই পাসওয়ার্ড দিয়েই সদস্যদের গোপন তথ্য (মোবাইল, এনআইডি) এনক্রিপ্ট হবে। ভুলে গেলে সেই তথ্য আর ফেরত পাওয়া যাবে না।</p><input type="password" id="p1" placeholder="পাসওয়ার্ড"><input type="password" id="p2" placeholder="আবার লিখুন"><button class="btn" id="aset">সেট করুন</button>`:`<input type="password" id="p1" placeholder="পাসওয়ার্ড"><button class="btn" id="alog">প্রবেশ</button>`}</div></main>`;
  $('#aclose').onclick=closeAdmin;
  if(first){
    $('#aset').onclick=async()=>{
      const a=$('#p1').value,b=$('#p2').value;
      if(a.length<8)return toast('কমপক্ষে ৮ অক্ষর দিন');if(a!==b)return toast('দুটি পাসওয়ার্ড মেলেনি');
      toast('অপেক্ষা করুন…');const salt=newSalt();adminKey=await deriveKey(a,salt);
      await prepDraft(salt);dirty=true;isAdmin=true;renderAdmin();
    };
  }else{
    const login=async()=>{
      const pw=$('#p1').value;if(!pw)return;toast('অপেক্ষা করুন…');
      let ok=false,salt;
      try{
        if(DB.check&&DB.encSalt){salt=DB.encSalt;adminKey=await deriveKey(pw,salt);ok=(await decStr(adminKey,DB.check))==='ok'}
        else if(DB.adminHash){ok=(await sha(pw))===DB.adminHash;if(ok){salt=newSalt();adminKey=await deriveKey(pw,salt)}}
      }catch(e){ok=false}
      if(!ok){adminKey=null;return toast('পাসওয়ার্ড ভুল')}
      await prepDraft(salt);dirty=!DB.check;isAdmin=true;renderAdmin();
    };
    $('#alog').onclick=login;$('#p1').onkeydown=e=>{if(e.key==='Enter')login()};
  }
}

function bindChanda(){
  const body=$('#abody');
  $('#chsave').onclick=()=>{draft.chanda={amount:Number($('#chamt').value)||0,start:$('#chstart').value||'2026-10',public:$('#chpub').checked};dirty=true;renderAdmin();toast('খসড়ায় সংরক্ষিত')};
  $('#cmon').onchange=e=>{if(e.target.value){adminMonth=e.target.value;renderAdmin()}};
  draft.payments=draft.payments||[];
  const ym=adminMonth||nowYM();
  body.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>pdfMember(draft,b.dataset.pdf,b));
  $('#pdfAllM').onclick=e=>pdfAll(draft,ymIdx(ym),ymIdx(ym),ymLabel(ym),e.currentTarget);
  $('#pdfAllL').onclick=e=>pdfAll(draft,0,1e9,'শুরু থেকে আজ পর্যন্ত (আজীবন)',e.currentTarget);
  body.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{
    const m=draft.members.find(x=>x.id===b.dataset.tg);if(!m)return;
    const i=draft.payments.findIndex(p=>p.mid===m.id&&p.ym===ym);
    if(i>=0)draft.payments.splice(i,1);else draft.payments.push({id:uid(),mid:m.id,ym,amount:mAmt(m,draft),date:today()});
    dirty=true;renderAdmin();
  });
  body.querySelectorAll('[data-multi]').forEach(b=>b.onclick=()=>{
    const m=draft.members.find(x=>x.id===b.dataset.multi);if(!m)return;
    const n=parseInt(prompt(m.name+' — কত মাসের চাঁদা একসাথে নিলেন? (সবচেয়ে পুরনো বাকি মাস থেকে ধরা হবে)','1'),10);
    if(!(n>0&&n<=120))return;
    const have=new Set(draft.payments.filter(p=>p.mid===m.id).map(p=>p.ym));
    let i=ymIdx(mStart(m,draft)),added=0;
    while(added<n){const k=idxYm(i++);if(!have.has(k)){draft.payments.push({id:uid(),mid:m.id,ym:k,amount:mAmt(m,draft),date:today()});added++}}
    dirty=true;renderAdmin();toast(bn(n)+' মাসের চাঁদা যোগ হয়েছে');
  });
}

const agoTxt=ms=>{const m=Math.floor((Date.now()-ms)/6e4);if(m<5)return 'এখন সক্রিয়';if(m<60)return bn(m)+' মিনিট আগে';const h=Math.floor(m/60);if(h<24)return bn(h)+' ঘণ্টা আগে';return bn(Math.floor(h/24))+' দিন আগে'};

function bindActivity(){
  const b=$('#trload');if(!b)return;
  b.onclick=async()=>{
    const k=$('#trk').value.trim();if(!k)return toast('অ্যাডমিন কী দিন');lsSet('ai_trk',k);
    const out=$('#trout');out.innerHTML='<div class="card"><p class="muted">আনা হচ্ছে…</p></div>';
    try{
      const r=await fetch(draft.track.url+'?a=list&k='+encodeURIComponent(k),{cache:'no-store'});
      const j=await r.json();if(!j.ok)throw new Error(j.err||'কী সঠিক নয়');
      const rows=j.rows||[],now=Date.now(),DAY=864e5;
      const act=rows.filter(x=>now-x.last<3e5).length,day=rows.filter(x=>now-x.last<DAY).length,wk=rows.filter(x=>now-x.last<7*DAY).length,pwa=rows.filter(x=>x.pwa).length;
      const ms=[...sortM(draft.members||[]),...sortM(draft.advisors||[]).map(a=>Object.assign({},a,{name:a.name+' (উপদেষ্টা)'}))].map(m=>{const d=rows.filter(x=>x.id===m.id);return{m,last:d.length?Math.max(...d.map(x=>x.last)):0,cnt:d.reduce((a,x)=>a+(+x.count||0),0),ver:d.some(x=>x.verified),email:(d.find(x=>x.email)||{}).email||''}});
      const used=ms.filter(x=>x.last).sort((a,b)=>b.last-a.last),never=ms.filter(x=>!x.last);
      const anon=rows.filter(x=>!x.id).length;
      const outs=rows.filter(x=>!x.id&&(x.name||x.email)).sort((a,b)=>b.last-a.last);
      out.innerHTML=`<div class="card"><div class="grid3"><div class="stat"><small>মোট ডিভাইস</small><b>${bn(rows.length)}</b></div><div class="stat"><small>এখন সক্রিয়</small><b class="in">${bn(act)}</b></div><div class="stat"><small>আজ</small><b>${bn(day)}</b></div></div>
<p class="muted" style="margin:8px 0 0">৭ দিনে ${bn(wk)} ডিভাইস · হোম স্ক্রিনে ইনস্টল ${bn(pwa)} · নাম ছাড়া ${bn(rows.filter(x=>!x.id&&!x.name).length)}</p></div>
<div class="card"><h3>✅ যারা অ্যাপে ঢুকেছেন (${bn(used.length)} জন)</h3>${used.length?used.map(x=>`<div class="row"><div class="grow"><span class="sn">${bn(x.m.serial)}</span><b>${esc(x.m.name)}</b>${x.ver?' <span title="Google যাচাইকৃত">✔️</span>':''}<br><small class="muted">${x.email?esc(x.email)+' · ':''}${bn(x.cnt)} বার খুলেছেন</small></div><small style="${Date.now()-x.last<3e5?'color:#0a7a4d;font-weight:700':'color:#666'}">${Date.now()-x.last<3e5?'🟢 ':''}${agoTxt(x.last)}</small></div>`).join(''):'<div class="empty">এখনো কেউ নাম বাছেননি</div>'}</div>
${outs.length?`<div class="card"><h3>🙋 নাম লিখে ঢুকেছেন — তালিকার বাইরে (${bn(outs.length)} জন)</h3>${outs.map(x=>`<div class="row"><div class="grow"><b>${esc(x.name||'(নাম নেই)')}</b>${x.verified?' ✔️':''}<br><small class="muted">${x.email?esc(x.email)+' · ':''}${bn(x.count)} বার খুলেছেন</small></div><small style="${Date.now()-x.last<3e5?'color:#0a7a4d;font-weight:700':'color:#666'}">${Date.now()-x.last<3e5?'🟢 ':''}${agoTxt(x.last)}</small></div>`).join('')}</div>`:''}
<div class="card"><h3>⏳ এখনো ঢোকেননি (${bn(never.length)} জন)</h3>${never.length?never.map(x=>`<div class="row"><div class="grow"><span class="sn">${bn(x.m.serial)}</span>${esc(x.m.name)}</div></div>`).join(''):'<div class="empty">সবাই ঢুকেছেন 🎉</div>'}</div>`;
    }catch(e){out.innerHTML=`<div class="card"><p style="color:#b3261e">❌ ${esc(/fetch|network|Failed/i.test(e.message)?'ইন্টারনেট সংযোগ নেই বা URL ভুল':e.message)}</p></div>`}
  };
}

function bannerImg(file,fit){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const c=document.createElement('canvas'),x=c.getContext('2d');let W=1280,H=560;
    if(fit==='contain'){const k=Math.min(1,1280/Math.max(im.width,im.height));W=Math.round(im.width*k);H=Math.round(im.height*k);c.width=W;c.height=H;x.fillStyle='#000';x.fillRect(0,0,W,H);x.drawImage(im,0,0,W,H)}
    else{c.width=W;c.height=H;const k=Math.max(W/im.width,H/im.height),w=im.width*k,h=im.height*k;x.fillStyle='#000';x.fillRect(0,0,W,H);x.drawImage(im,(W-w)/2,(H-h)/2,w,h)}
    URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.8))};
  im.onerror=()=>{URL.revokeObjectURL(url);rej()};im.src=url})}

function resizeImg(file,size=360){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
    const s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=(im.height-s)*0.2;
    x.fillStyle='#fff';x.fillRect(0,0,size,size);x.drawImage(im,sx,sy,s,s,0,0,size,size);
    URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.8))};
  im.onerror=()=>{URL.revokeObjectURL(url);rej()};im.src=url})}

/* ---------- প্রকাশ (GitHub API) ---------- */
const b64=s=>{const b=TE.encode(s);let r='';b.forEach(x=>r+=String.fromCharCode(x));return btoa(r)};
const ghErr=st=>new Error(st===401||st===403?'টোকেন সঠিক নয় বা Contents লেখার অনুমতি নেই':st===409?'সংঘর্ষ হয়েছে, আবার চেষ্টা করুন':'সেভ ব্যর্থ ('+st+')');
async function putFile(base,H,path,content64,msg){
  let sha1;const g=await fetch(base+path,{headers:H,cache:'no-store'});
  if(g.ok)sha1=(await g.json()).sha;else if(g.status!==404)throw ghErr(g.status);
  const body={message:msg,content:content64};if(sha1)body.sha=sha1;
  const p=await fetch(base+path,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify(body)});
  if(!p.ok)throw ghErr(p.status);
}
async function buildPublic(){
  const out=clone(draft);out.members=[];out.advisors=[];
  for(const key of ['members','advisors']){
    for(const m of (draft[key]||[])){
      const pub={id:m.id,serial:m.serial,name:m.name,role:m.role||'',father:m.father||'',profession:m.profession||'',blood:m.blood||'',village:m.village||'',post:m.post||'',thana:m.thana||'',district:m.district||'',showPhone:!!m.showPhone};
      if(key==='members'){pub.camt=m.camt==null?'':m.camt;pub.cstart=m.cstart||''}
      if(m.photo){pub.photo=m.photo;pub.pv=m.pv}
      if(m.showPhone&&m.mobile)pub.mobile=m.mobile;
      const sec={mobile:m.mobile||'',guardian:m.guardian||'',nid:m.nid||''};
      if(sec.mobile||sec.guardian||sec.nid)pub.enc=await encStr(adminKey,JSON.stringify(sec));
      out[key].push(pub);
    }
  }
  out.banners=(draft.banners||[]).filter(b=>b.photo).map(b=>({id:b.id,photo:b.photo,pv:b.pv,fit:b.fit||'cover',cap:b.cap||''}));delete out.delPhotos;
  out.check=await encStr(adminKey,'ok');delete out.adminHash;
  return out;
}
async function publish(){
  const o=$('#gho').value.trim(),r=$('#ghr').value.trim(),t=$('#ght').value.trim();
  if(!o||!r||!t)return toast('ইউজারনেম, রিপো ও টোকেন দিন');
  lsSet('ai_gh',{owner:o,repo:r,token:t});
  const base=`https://api.github.com/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}/contents/`;
  const H={Authorization:'Bearer '+t,Accept:'application/vnd.github+json'};
  const btn=$('#apub');btn.disabled=true;btn.textContent='প্রকাশ হচ্ছে…';
  try{
    for(const m of [...draft.members,...(draft.advisors||[])]){
      if(m.photoData){
        btn.textContent='ছবি আপলোড হচ্ছে…';
        const path='photos/'+m.id+'.jpg';
        await putFile(base,H,path,m.photoData.split(',')[1],'ছবি');
        m.photo=path;m.pv=Date.now();delete m.photoData;
      }
    }
    for(const b of (draft.banners||[])){
      if(b.photoData){btn.textContent='ব্যানার আপলোড হচ্ছে…';const path='banners/'+b.id+'.jpg';await putFile(base,H,path,b.photoData.split(',')[1],'ব্যানার');b.photo=path;b.pv=Date.now();delete b.photoData}
    }
    btn.textContent='তথ্য সেভ হচ্ছে…';
    const out=await buildPublic();
    await putFile(base,H,'data.json',b64(JSON.stringify(out,null,2)),'ডাটা আপডেট');
    for(const path of (draft.delPhotos||[])){try{const g=await fetch(base+path,{headers:H,cache:'no-store'});if(g.ok){const sha=(await g.json()).sha;await fetch(base+path,{method:'DELETE',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify({message:'ব্যানার মুছে ফেলা',sha})})}}catch(e){}}
    draft.delPhotos=[];
    DB=clone(out);lsSet('ai_cache',DB);dirty=false;render();updateBadge();toast('✅ সফলভাবে প্রকাশিত হয়েছে');renderAdmin();
  }catch(e){toast('❌ '+(/fetch|network/i.test(e.message)?'ইন্টারনেট সংযোগ নেই':e.message));const b=$('#apub');if(b){b.disabled=false;b.textContent='🚀 প্রকাশ করুন'}}
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
applyTheme(lsGet('ai_theme','emerald'));
load();
</script>
